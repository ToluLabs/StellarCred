name: Release

on:
  push:
    tags:
      - 'v*'

# ── Security: least-privilege permissions ──────────────────────────────────
# contents:write – push updated CHANGELOG.md back to main.
# id-token:write – lets npm mint the OIDC token that signs the provenance
#                  attestation for each published package (npm --provenance).
#
# This workflow only fires on tag pushes (v*), never on pull_request or
# pull_request_target. Fork PRs cannot trigger it, so NPM_TOKEN is never
# exposed to untrusted code.
permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Changelog, GitHub Release & npm publish
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # full history for changelog generation

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # --ignore-scripts: no dependency or workspace lifecycle script runs in a
      # job that later holds NPM_TOKEN. The packages are built explicitly below
      # (the frontend `postinstall` would otherwise build the issuer).
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # The SDK is not a member of the frontend workspace (it has its own
      # lockfile), so the install above does not provide its build tooling.
      - name: Install SDK dependencies
        working-directory: frontend/packages/sdk
        run: pnpm install --frozen-lockfile --ignore-workspace --ignore-scripts

      # Extract the version from the tag (strips leading 'v') and pick the npm
      # dist-tag. A pre-release (vX.Y.Z-rc.1) must never take `latest`, so it is
      # published under `next`.
      - name: Set version env
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "RELEASE_VERSION=${VERSION}" >> "$GITHUB_ENV"
          case "$VERSION" in
            *-*) echo "NPM_TAG=next" >> "$GITHUB_ENV" ;;
            *)   echo "NPM_TAG=latest" >> "$GITHUB_ENV" ;;
          esac

      # Fail before any side effect (changelog commit, GitHub release, publish):
      #  - the tag, @stellarcred/sdk and @stellarcred/issuer versions must all agree
      #  - package metadata must be publishable, incl. a repository.url that
      #    matches this repo (npm provenance rejects a mismatch)
      - name: Validate release packages (version alignment + metadata)
        working-directory: .
        run: node .github/scripts/validate-release-packages.mjs --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"

      - name: Build SDK
        working-directory: frontend/packages/sdk
        run: pnpm build

      # `prebuild` copies the compiled commit circuits into src/ so they are
      # inlined into dist/ — the published package is self-contained.
      - name: Build issuer
        working-directory: frontend/packages/issuer
        run: pnpm build

      - name: Validate package tarballs
        working-directory: .
        run: node .github/scripts/validate-release-packages.mjs --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --packed

      # Same code path as the real publish below, minus credentials and upload.
      - name: Publish dry run
        working-directory: .
        run: bash .github/scripts/publish-packages.sh dry-run "$NPM_TAG"

      # Generate / update CHANGELOG.md at the repo root using conventional-changelog
      - name: Update CHANGELOG.md
        working-directory: .
        run: |
          npx --yes conventional-changelog-cli \
            -p angular \
            -i CHANGELOG.md \
            -s \
            -r 0

      # Extract only the section for this release to use as the GitHub Release body
      - name: Extract release notes
        id: notes
        working-directory: .
        run: |
          NOTES=$(npx --yes conventional-changelog-cli -p angular -r 1 --outfile /dev/stdout 2>/dev/null)
          # Store as multiline env var using a random delimiter to avoid EOF injection
          DELIM=$(openssl rand -hex 8)
          {
            echo "RELEASE_NOTES<<$DELIM"
            echo "$NOTES"
            echo "$DELIM"
          } >> "$GITHUB_ENV"

      # Commit the updated CHANGELOG.md back to the default branch
      - name: Commit CHANGELOG.md
        working-directory: .
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          # Only commit if there are staged changes
          if ! git diff --cached --quiet; then
            git commit -m "chore: update CHANGELOG.md for ${{ github.ref_name }} [skip ci]"
            # Fetch the latest main and retry rebase/push in case of concurrent merges
            for i in 1 2 3 4 5; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort
                echo "Rebase conflict, retrying in 5 seconds..."
                sleep 5
                continue
              fi
              if git push origin HEAD:main; then
                echo "Successfully pushed CHANGELOG to main."
                exit 0
              fi
              echo "Push failed, retrying in 5 seconds..."
              sleep 5
            done
            echo "Failed to push CHANGELOG to main after multiple attempts."
            exit 1
          fi

      # Create the GitHub Release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ env.RELEASE_NOTES }}
          prerelease: ${{ contains(env.RELEASE_VERSION, '-') }}

      # Publish @stellarcred/sdk and @stellarcred/issuer to npm, with provenance.
      # The packages were built, validated and dry-run above; this only uploads.
      # NPM_CONFIG_PROVENANCE makes npm attach a signed attestation linking each
      # tarball to this repository, commit and workflow run (needs id-token:write).
      - name: Publish to npm
        working-directory: .
        run: bash .github/scripts/publish-packages.sh publish "$NPM_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

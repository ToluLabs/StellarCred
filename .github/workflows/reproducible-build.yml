name: Reproducible Build

# Determinism check for the StellarCred contract WASM artifacts.
#
# Two independent builds run inside the pinned reproducible-build container
# so the canonical build environment is identical for both comparisons.
# Each build starts from a fresh CARGO_TARGET_DIR (/tmp/target inside the
# container) so there is no shared incremental state between runs.
#
# A pass demonstrates that independent executions of the canonical build
# environment produce byte-identical WASM artifacts.

on:
  push:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docker/Dockerfile.reproducible'
      - '.github/workflows/reproducible-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'contracts/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'docker/Dockerfile.reproducible'
      - '.github/workflows/reproducible-build.yml'

permissions:
  contents: read

jobs:
  reproducible-build:
    name: Build twice (container), compare hashes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # ── Build the Docker image ────────────────────────────────────────────
      # --no-cache ensures we always compile from the current commit's source,
      # not a cached layer that may have baked in older contract source code.
      - name: Build Docker image
        run: |
          docker build \
            --no-cache \
            -f docker/Dockerfile.reproducible \
            -t stellarcred-build:ci \
            .

      # ── Container build 1 ─────────────────────────────────────────────────
      # Mount the live workspace as /workspace (overrides the baked-in source)
      # so both runs compile the identical current checkout.
      # CARGO_TARGET_DIR is set to /tmp/target inside the container so each
      # run starts from a fully clean build directory with no shared state.
      - name: Build WASM (container run 1)
        run: |
          mkdir -p build-1
          cat > /tmp/container-build.sh << 'SCRIPT'
          set -e
          export CARGO_TARGET_DIR=/tmp/target
          rm -rf "$CARGO_TARGET_DIR"
          cargo build --release --target wasm32v1-none --locked --offline
          cp "$CARGO_TARGET_DIR/wasm32v1-none/release/credential_verifier.wasm" \
             "$CARGO_TARGET_DIR/wasm32v1-none/release/issuer_registry.wasm" \
             "$CARGO_TARGET_DIR/wasm32v1-none/release/proof_registry.wasm" \
             "$CARGO_TARGET_DIR/wasm32v1-none/release/gated_pool.wasm" \
             /out/
          SCRIPT
          chmod +x /tmp/container-build.sh
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/build-1:/out" \
            -v "/tmp/container-build.sh:/container-build.sh:ro" \
            -e SOURCE_DATE_EPOCH=0 \
            -e "RUSTFLAGS=--remap-path-prefix=/workspace=/workspace --remap-path-prefix=/usr/local/cargo=/usr/local/cargo --remap-path-prefix=/usr/local/rustup=/usr/local/rustup" \
            stellarcred-build:ci \
            sh /container-build.sh

      - name: Hash container run-1 artifacts
        run: |
          echo "=== Container run 1 SHA-256 hashes ==="
          sha256sum build-1/*.wasm | tee build-1/sha256sums.txt

      # ── Container build 2 ─────────────────────────────────────────────────
      # Reuses the same bind-mounted build script. CARGO_TARGET_DIR=/tmp/target
      # is rm -rf'd at the start of the script so this run is fully independent
      # of run 1 with no shared incremental state.
      - name: Build WASM (container run 2)
        run: |
          mkdir -p build-2
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/build-2:/out" \
            -v "/tmp/container-build.sh:/container-build.sh:ro" \
            -e SOURCE_DATE_EPOCH=0 \
            -e "RUSTFLAGS=--remap-path-prefix=/workspace=/workspace --remap-path-prefix=/usr/local/cargo=/usr/local/cargo --remap-path-prefix=/usr/local/rustup=/usr/local/rustup" \
            stellarcred-build:ci \
            sh /container-build.sh

      - name: Hash container run-2 artifacts
        run: |
          echo "=== Container run 2 SHA-256 hashes ==="
          sha256sum build-2/*.wasm | tee build-2/sha256sums.txt

      # ── Reproducibility check ─────────────────────────────────────────────
      - name: Verify reproducible container builds
        run: |
          echo "=== Reproducibility verification ==="

          echo "--- Container build 1 ---"
          cat build-1/sha256sums.txt

          echo "--- Container build 2 ---"
          cat build-2/sha256sums.txt

          if diff \
               <(awk '{print $1}' build-1/sha256sums.txt | sort) \
               <(awk '{print $1}' build-2/sha256sums.txt | sort); then
            echo "✓ Reproducibility check passed."
            echo "✓ Independent container builds produced identical WASM."
          else
            echo "✗ Reproducibility check FAILED."
            echo ""
            echo "--- Build 1 ---"
            cat build-1/sha256sums.txt
            echo ""
            echo "--- Build 2 ---"
            cat build-2/sha256sums.txt
            exit 1
          fi

      # ── Canonical hash manifest ───────────────────────────────────────────
      - name: Produce canonical hash manifest
        run: |
          {
            echo "# StellarCred WASM SHA-256 hashes"
            echo "# Commit:    ${{ github.sha }}"
            echo "# Ref:       ${{ github.ref }}"
            echo "# Workflow:  ${{ github.run_id }}"
            echo "# Toolchain: $(docker run --rm stellarcred-build:ci rustc --version)"
            echo "# Verified:  2x independent container builds (byte-identical)"
            echo "#"
            awk '{print $1, $2}' build-1/sha256sums.txt
          } > canonical-hashes.txt
          cat canonical-hashes.txt

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: wasm-artifacts-${{ github.sha }}
          path: build-1/*.wasm
          retention-days: 30

      - name: Upload canonical hash manifest
        uses: actions/upload-artifact@v7
        with:
          name: wasm-hashes-${{ github.sha }}
          path: canonical-hashes.txt
          retention-days: 90

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ── Security: top-level least-privilege ────────────────────────────────────
# Set the narrowest default; jobs that need more declare it explicitly.
# • contents:read – checkout source for every job.
# • No pull-requests or packages access at the top level.
# This workflow does not use repository secrets (only GITHUB_TOKEN for
# PR comments and npm cache), so fork PRs cannot exfiltrate anything.
permissions:
  contents: read

# ── Shared tool versions (single source of truth) ──────────────────────────
# Update these three values to upgrade the entire pipeline in one place.
env:
  NOIR_VERSION: "1.0.0-beta.9"
  BB_VERSION: "0.87.0"
  NODE_VERSION: "20"

jobs:
  # ── Dependency review: advisories, licenses, maintenance ──────────────────
  # Runs early in the matrix to fail fast on dependency violations.
  # Blocks PRs with new packages that have known advisories or denied licenses.
  dependency-check:
    name: Dependency review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Review npm dependency changes (GitHub Advisory DB)
        uses: actions/dependency-review-action@v4
        continue-on-error: true

      - name: Setup Node for custom checks
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check for new frontend runtime dependencies
        run: |
          node .github/scripts/check-runtime-deps.mjs
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}

      - name: Verify allowed licenses in npm tree
        working-directory: frontend
        run: |
          node ../.github/scripts/verify-npm-licenses.mjs

  commitlint:
    name: Lint commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
      - name: Lint commits in PR
        run: |
          npx --yes -p @commitlint/cli -p @commitlint/config-conventional commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

  # ── Docs: contract API reference drift check (issue #525) ─────────────────
  # Cheap source-vs-docs gate: fails when a ProofRegistry entrypoint is added,
  # removed or renamed without the matching update to docs/PROOF_REGISTRY_API.md,
  # or when a documented section goes stale / loses its Audience, Auth or Panics
  # line. Runs before the heavyweight jobs so doc drift fails fast.
  api-reference:
    name: Contract API reference drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Check API reference against contract source
        run: node .github/scripts/check-api-reference.mjs

  # ── Docs: no new process artifacts (issue #684) ──────────────────────────
  # Implementation summaries, status reports and PR descriptions document how a
  # change was made rather than how the system works, go stale at merge, and bury
  # the docs that stay true. They belong in the PR description. Only files ADDED by
  # the PR are checked, so the legacy documents still in the tree don't fail every
  # build. Fails fast — no toolchain or dependencies needed.
  process-docs:
    name: Process artifact check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check for new process-artifact documents
        run: node .github/scripts/check-process-docs.mjs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

  # ── Contracts: Rust / WASM / Clippy ────────────────────────────────────────
  # Runs in parallel with circuits, frontend, and indexer.
  contracts:
    name: Contract tests & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Toolchain version is read from rust-toolchain.toml; specifying it
          # here too lets the action cache by version rather than just "stable".
          toolchain: "1.93.1"
          targets: wasm32v1-none
          components: clippy

      - name: Cache cargo registry + build products
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Install Noir
        uses: actions/cache@v4
        id: cache-noir
        with:
          path: ~/.nargo
          key: nargo-${{ runner.os }}-${{ env.NOIR_VERSION }}
      - if: steps.cache-noir.outputs.cache-hit != 'true'
        name: Download Noir toolchain
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          export PATH="$HOME/.nargo/bin:$PATH"
          noirup -v ${{ env.NOIR_VERSION }}

      - name: Install Barretenberg
        uses: actions/cache@v4
        id: cache-bb
        with:
          path: ~/.bb
          key: bb-${{ runner.os }}-${{ env.BB_VERSION }}
      - if: steps.cache-bb.outputs.cache-hit != 'true'
        name: Download Barretenberg toolchain
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/AztecProtocol/aztec-packages/refs/heads/next/barretenberg/bbup/install | bash
          export PATH="$HOME/.bb:$PATH"
          source "$HOME/.bashrc" 2>/dev/null || true
          bbup -v ${{ env.BB_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate circuit fixtures
        shell: bash
        run: |
          export PATH="$HOME/.nargo/bin:$HOME/.bb:$PATH"
          bash ./circuits/scripts/build.sh

      - name: Build WASM artifacts
        # --locked ensures Cargo.lock is respected exactly (no silent dep upgrades).
        run: cargo build --release --target wasm32v1-none --locked

      - name: Lint (clippy)
        # Blocking — clippy warnings are treated as errors for all contract
        # crates. Any new lint must either be fixed or explicitly allowed with
        # a documented reason using #[allow(clippy::lint_name)] inline.
        # --workspace so the host-only test harness (contracts/test_support) is
        # linted too; a bare build skips it, since only the deployable contracts
        # are default workspace members.
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ── Circuits: Noir compile + VK freshness check ────────────────────────────
  # Runs in parallel with contracts, frontend, and indexer.
  circuits:
    name: Circuit compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: circuits
    steps:
      - uses: actions/checkout@v7

      - name: Restore / install Noir toolchain
        uses: actions/cache@v4
        id: cache-noir-circuits
        with:
          path: ~/.nargo
          key: nargo-${{ runner.os }}-${{ env.NOIR_VERSION }}
      - if: steps.cache-noir-circuits.outputs.cache-hit != 'true'
        name: Download Noir toolchain
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/noir-lang/noirup/324a51fca2c410d2477400316efc5ce0d743a5b3/install | bash
          export PATH="$HOME/.nargo/bin:$PATH"
          noirup -v ${{ env.NOIR_VERSION }}

      - name: Restore / install Barretenberg toolchain
        uses: actions/cache@v4
        id: cache-bb-circuits
        with:
          path: ~/.bb
          key: bb-${{ runner.os }}-${{ env.BB_VERSION }}
      - if: steps.cache-bb-circuits.outputs.cache-hit != 'true'
        name: Download Barretenberg toolchain
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/AztecProtocol/aztec-packages/refs/heads/next/barretenberg/bbup/install | bash
          export PATH="$HOME/.bb:$PATH"
          source "$HOME/.bashrc" 2>/dev/null || true
          bbup -v ${{ env.BB_VERSION }}

      - name: Compile circuits
        run: |
          export PATH="$HOME/.nargo/bin:$PATH"
          for dir in commit commit3 kyc_proof age_proof income_proof jurisdiction_proof funds_proof accreditation_proof employment_proof aggregate_proof set_membership date_range; do
            echo "=== $dir ==="
            (cd "$dir" && nargo compile)
          done

      - name: Track circuit constraint counts and verify baselines
        run: |
          export PATH="$HOME/.nargo/bin:$PATH"
          node scripts/track-constraints.js --compare ../perf/circuit-constraint-baselines.json --threshold 0.15
        working-directory: circuits

      - name: Verify deterministic VK hashes
        run: |
          export PATH="$HOME/.nargo/bin:$HOME/.bb:$PATH"
          bash ../scripts/verify-vks.sh check

      - name: Check staged artifacts are current
        run: |
          export PATH="$HOME/.nargo/bin:$HOME/.bb:$PATH"

          # Circuit package name -> frontend credential-type filename, read from
          # the shared version module rather than a third copy of this table.
          type_of() {
            node -e 'process.stdout.write(require(process.argv[1]).typeOfCircuit(process.argv[2]))' \
              "$PWD/scripts/circuit-versions.js" "$1"
          }

          FAILED=0
          VK_TMP="/tmp/vk_check"
          rm -rf "$VK_TMP"

          for dir in kyc_proof age_proof income_proof jurisdiction_proof funds_proof employment_proof aggregate_proof accreditation_proof set_membership date_range; do
            type=$(type_of "$dir")
            json="target/${dir}.json"
            out="$VK_TMP/$type"
            echo "=== Re-deriving VK for $type ==="

            mkdir -p "$out"
            bb write_vk --scheme ultra_honk --oracle_hash keccak \
              --bytecode_path "$json" \
              --output_path "$out" --output_format bytes_and_fields

            # bb may nest the vk under a subdirectory
            if [ -f "$out/vk/vk" ]; then
              actual="$out/vk/vk"
            elif [ -f "$out/vk" ]; then
              actual="$out/vk"
            else
              actual=$([ -f "$out/vk_fields" ] && echo "$out/vk_fields" || echo "$out/vk")
            fi

            if [ ! -f "$actual" ]; then
              echo "::error::bb did not produce a VK for $type (expected one file under $out)"
              FAILED=1
              continue
            fi

            fixture="../fixtures/$type/vk"
            if [ ! -f "$fixture" ]; then
              echo "  MISSING — auto-staging fixtures/$type/vk from freshly compiled circuit"
              mkdir -p "../fixtures/$type"
              cp "$actual" "$fixture"
            elif diff -q "$actual" "$fixture" >/dev/null 2>&1; then
              ech
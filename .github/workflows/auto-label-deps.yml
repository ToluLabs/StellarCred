name: Auto-label Dependency PRs

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  issues: write
  # Labelling a *pull request* is authorised against pull-requests, not issues:
  # with only `issues: write` the token gets 403 "Resource not accessible by
  # integration" from POST /issues/{n}/labels.
  pull-requests: write

concurrency:
  group: auto-label-deps-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DEPENDENCY_LABEL_NAME: ${{ vars.DEPENDENCY_LABEL_NAME || 'deps' }}

jobs:
  auto-label:
    if: github.event.pull_request.head.repo.full_name == github.repository
    name: Apply dependency label
    runs-on: ubuntu-latest
    steps:
      - name: Check out the labeler script from the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Classify PR and apply label
        uses: actions/github-script@v9
        with:
          script: |
            const { classifyDependencyPr, resolveDependencyLabel } = await import(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/label-deps.mjs`
            );

            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });

            const classification = classifyDependencyPr({
              author: pr.user?.login,
              branch: pr.head?.ref,
              title: pr.title,
              changedFiles: changedFiles.map((file) => file.filename),
            });

            const labelName = resolveDependencyLabel(
              process.env.DEPENDENCY_LABEL_NAME
            );

            if (!classification.isDependency) {
              core.info(
                `PR #${pr.number} is not a dependency update; no label applied.`
              );
              return;
            }

            core.info(
              `PR #${pr.number} is a dependency update (${classification.reasons.join(
                ", "
              )}). Applying '${labelName}'.`
            );

            // Labelling is best-effort: a permission or API hiccup must never
            // fail the PR's own checks. (Without `pull-requests: write`,
            // POST /issues/{n}/labels returned 403 and every PR classified as
            // a dependency update went red.)
            try {
              // addLabels fails with 404 when the label does not exist yet.
              // Create it on first use so a fresh repository (or a newly
              // configured DEPENDENCY_LABEL_NAME) labels successfully.
              try {
                await github.rest.issues.getLabel({ owner, repo, name: labelName });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner,
                    repo,
                    name: labelName,
                    color: "ededed",
                    description: "Dependency update (Dependabot/Renovate)",
                  });
                } catch (createError) {
                  // Another run may have created it between get and create.
                  if (createError.status !== 422) throw createError;
                }
              }

            try {
              await github.rest.issues.getLabel({ owner, repo, name: labelName });
            } catch (error) {
              if (error.status !== 404) {
                core.warning(
                  `Could not verify label '${labelName}' for PR #${pr.number}: ${error.message}. Skipping label application.`
                );
                return;
              }

              try {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name: labelName,
                  color: "ededed",
                  description: "Dependency update (Dependabot/Renovate)",
                });
              } catch (createError) {
                if (createError.status !== 422) {
                  core.warning(
                    `Could not create label '${labelName}' for PR #${pr.number}: ${createError.message}. Skipping label application.`
                  );
                  return;
                }
              }

            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: pr.number,
                labels: [labelName],
              });

              core.info(`Applied '${labelName}' to PR #${pr.number}.`);
            } catch (error) {
              core.warning(
                `Could not apply '${labelName}' to PR #${pr.number}: ${error.message} ` +
                  `(labelling is best-effort, not failing this check).`
              );
            } catch (error) {
              core.warning(
                `Could not apply label '${labelName}' to PR #${pr.number}: ${error.message}. Skipping.`
              );
              return;
            }

              core.info(`Applied '${labelName}' to PR #${pr.number}.`);
            } catch (error) {
              if (error.status === 403) {
                core.warning(
                  `Insufficient permissions to apply label '${labelName}' to PR #${pr.number}: ${error.message}`
                );
              } else {
                throw error;
              }
            }

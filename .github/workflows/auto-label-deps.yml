name: Auto-label Dependency PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  issues: write

env:
  LABEL_NAME: ${{ vars.DEPENDENCY_LABEL_NAME || 'deps' }}

jobs:
  auto-label:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Check author and apply label
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const title = pr.title.toLowerCase();
            const branch = pr.head.ref;
            
            const isDependabot = author === 'dependabot[bot]' || branch.startsWith('dependabot/');
            const isRenovate = author === 'renovate[bot]' || branch.startsWith('renovate/');
            const isDependencyBump = title.includes('bump') || title.includes('deps') || title.includes('dependency');

            if (isDependabot || isRenovate || isDependencyBump) {
              const labelName = process.env.LABEL_NAME || 'deps';
              console.log(`Applying label '${labelName}' to PR #${pr.number} (author: ${author}, branch: ${branch})`);
              
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              try {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name: labelName });
                } catch (error) {
                  if (error.status !== 404) throw error;
                  try {
                    await github.rest.issues.createLabel({
                      owner,
                      repo,
                      name: labelName,
                      color: "ededed",
                      description: "Dependency update (Dependabot/Renovate)",
                    });
                  } catch (createError) {
                    // Another run may have created it between get and create.
                    if (createError.status !== 422) throw createError;
                  }
                }

                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels: [labelName]
                });
                console.log('Successfully applied dependency label.');
              } catch (error) {
                core.setFailed(`Failed to add label: ${error.message}`);
              }
            } else {
              console.log('PR is not recognized as a dependency update.');
            }

name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'frontend/**'

# ── Security: least-privilege permissions ──────────────────────────────────
# contents:read   – checkout source only; no write to any ref.
# pull-requests:write – post/update the preview comment on PRs.
#
# Safety against fork PRs:
#   • Trigger is `pull_request` (not `pull_request_target`), so GitHub does
#     NOT expose repository secrets to workflows triggered by fork PRs.
#   • The deploy-preview job additionally enforces
#     head.repo.full_name == github.repository, ensuring even non-secret
#     steps never run for fork-sourced PRs.
#   • VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID are only accessed
#     inside steps guarded by that check.
permissions:
  contents: read
  pull-requests: write

jobs:
  deploy-preview:
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # Job-level permissions: same as top-level, declared explicitly for
    # auditability. This job needs contents:read (checkout) and
    # pull-requests:write (PR comment via actions/github-script).
    permissions:
      contents: read
      pull-requests: write
    env:
      VERCEL_TOKEN_SET: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      # Default checkout: merges base into head for the PR merge-commit ref.
      # This is safe — it never checks out arbitrary fork code with secrets
      # in scope, because the fork guard above prevents this step from running
      # on fork PRs.
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN_SET == 'true'
        run: pnpm add -g vercel

      - name: Pull Vercel Environment Information
        if: env.VERCEL_TOKEN_SET == 'true'
        working-directory: ./frontend
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Validate Deployment Environment
        if: env.VERCEL_TOKEN_SET == 'true'
        working-directory: ./frontend
        run: node scripts/validate-deploy-env.mjs --target=staging
        env:
          NEXT_PUBLIC_STELLAR_NETWORK: "testnet"
          NEXT_PUBLIC_PROOF_REGISTRY_ID: ${{ secrets.NEXT_PUBLIC_PROOF_REGISTRY_ID || 'CB2R3O43TX3G3N3X4Y5Z6A7B8C9D0E1F2G3H4I5J6K7L8M9N0O' }}
          NEXT_PUBLIC_ISSUER_REGISTRY_ID: ${{ secrets.NEXT_PUBLIC_ISSUER_REGISTRY_ID || 'CB2R3O43TX3G3N3X4Y5Z6A7B8C9D0E1F2G3H4I5J6K7L8M9N0O' }}
          NEXT_PUBLIC_CREDENTIAL_VERIFIER_ID: ${{ secrets.NEXT_PUBLIC_CREDENTIAL_VERIFIER_ID || 'CB2R3O43TX3G3N3X4Y5Z6A7B8C9D0E1F2G3H4I5J6K7L8M9N0O' }}
          NEXT_PUBLIC_GATED_POOL_ID: ${{ secrets.NEXT_PUBLIC_GATED_POOL_ID || 'CB2R3O43TX3G3N3X4Y5Z6A7B8C9D0E1F2G3H4I5J6K7L8M9N0O' }}

      - name: Build Project Artifacts
        if: env.VERCEL_TOKEN_SET == 'true'
        working-directory: ./frontend
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_STELLAR_NETWORK: "testnet"
          NEXT_PUBLIC_PROOF_REGISTRY_ID: ${{ secrets.NEXT_PUBLIC_PROOF_REGISTRY_ID || 'CB2R3O43TX3G3N3X4Y5Z6A7B8C9D0E1F2G3H4I5J6K7L8M9N0O' }}
          NEXT_PUBLIC_ISSUER_REGISTRY_ID: ${{ secrets.NEXT_PUBLIC_ISSUER_REGISTRY_ID || 'CB2R3O43TX3G3N3X4Y5Z6A7B8C9D0E1F2G3H4I5J6K7L8M9N0O' }}
          NEXT_PUBLIC_CREDENTIAL_VERIFIER_ID: ${{ secrets.NEXT_PUBLIC_CREDENTIAL_VERIFIER_ID || 'CB2R3O43TX3G3N3X4Y5Z6A7B8C9D0E1F2G3H4I5J6K7L8M9N0O' }}
          NEXT_PUBLIC_GATED_POOL_ID: ${{ secrets.NEXT_PUBLIC_GATED_POOL_ID || 'CB2R3O43TX3G3N3X4Y5Z6A7B8C9D0E1F2G3H4I5J6K7L8M9N0O' }}

      - name: Deploy Project Artifacts to Vercel
        if: env.VERCEL_TOKEN_SET == 'true'
        id: deploy
        working-directory: ./frontend
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview_url=$url" >> $GITHUB_OUTPUT
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment PR with Preview Link
        if: env.VERCEL_TOKEN_SET == 'true'
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
        with:
          script: |
            const previewUrl = process.env.PREVIEW_URL;
            const issue_number = context.issue.number;
            const body = `### 🚀 Preview Deployment Ready!\n\n| Name | Link |\n| --- | --- |\n| **Latest Deploy** | [${previewUrl}](${previewUrl}) |\n\n*Built automatically for commit ${context.sha.substring(0, 7)}*`;
            
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
            });

            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('🚀 Preview Deployment Ready!'));

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: body
              });
            }

  teardown-preview:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # teardown-preview only reads PR comments to find the preview URL,
    # then removes the Vercel deployment. No PR write needed.
    permissions:
      contents: read
      pull-requests: read
    env:
      VERCEL_TOKEN_SET: ${{ secrets.VERCEL_TOKEN != '' }}
    steps:
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN_SET == 'true'
        run: pnpm add -g vercel

      - name: Find Preview URL from PR Comment
        if: env.VERCEL_TOKEN_SET == 'true'
        id: find-url
        uses: actions/github-script@v9
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('🚀 Preview Deployment Ready!'));
            if (!botComment) {
              core.setOutput('preview_url', '');
              return;
            }

            const match = botComment.body.match(/\[(https:\/\/[^\]]+)\]\(https:\/\/[^)]+\)/);
            core.setOutput('preview_url', match ? match[1] : '');

      - name: Remove Preview Deployment
        if: env.VERCEL_TOKEN_SET == 'true' && steps.find-url.outputs.preview_url != ''
        run: vercel remove "$PREVIEW_URL" --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          PREVIEW_URL: ${{ steps.find-url.outputs.preview_url }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

name: Verify Deployment

on:
  workflow_dispatch:
    inputs:
      network:
        description: "Network to verify (testnet or mainnet)"
        required: true
        default: "testnet"
        type: choice
        options:
          - testnet
          - mainnet
  schedule:
    - cron: "0 2 * * *" # Nightly at 02:00 UTC
  pull_request:
    paths:
      - "scripts/verify-deployment.sh"
      - "scripts/verify-onchain.mjs"
      - ".github/workflows/verify-deployment.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify deployment end-to-end (${{ inputs.network || 'testnet' }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain and wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93.1"
          targets: wasm32v1-none

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      # Prebuilt release binary: building stellar-cli from source needs
      # extra system libraries and takes several minutes.
      - name: Install Stellar CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/stellar/stellar-cli/releases/download/v27.0.0/stellar-cli-27.0.0-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$HOME/.cargo/bin" stellar
          stellar --version

      - name: Install Noir and Barretenberg
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/noir-lang/noirup/main/install | bash
          export PATH="$HOME/.nargo/bin:$PATH"
          noirup -v 1.0.0-beta.9
          curl -fsSL https://raw.githubusercontent.com/AztecProtocol/aztec-packages/refs/heads/next/barretenberg/bbup/install | bash
          export PATH="$HOME/.bb:$PATH"
          bbup -v 0.87.0

      - name: Run verification command
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.nargo/bin:$HOME/.bb:$PATH"
          make verify-deployment NETWORK="${{ inputs.network || 'testnet' }}"

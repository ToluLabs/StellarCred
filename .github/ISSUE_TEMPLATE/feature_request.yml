name: Feature request
description: Suggest an improvement or new capability
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New credential type
        - Contracts
        - Circuits
        - Frontend / UX
        - SDK
        - Issuer integrations
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or gap this addresses.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see? Rough design notes are fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any other approaches you thought about?
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Depends on / blocked by
      description: >-
        List any issues that must land before this one can be worked on
        (e.g. `Blocked by #123`). Leave blank if none. Do not apply the
        `good first issue` label to an issue that lists a dependency.
      placeholder: |
        Blocked by #<issue number>
    validations:
      required: false

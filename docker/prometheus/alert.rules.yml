groups:
  - name: stellarcred_alerts
    rules:
      # 1. Indexer Lag Alert
      - alert: IndexerLagHigh
        expr: stellarcred_indexer_ledgers_behind > 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Indexer lagging behind ledger head"
          description: "The indexer is currently {{ $value }} ledgers behind head (threshold: > 10 ledgers)."

      # 2. Issuance Failure Rate Alert
      - alert: HighIssuanceFailureRate
        expr: (sum(rate(stellarcred_issuance_failures_total[5m])) / sum(rate(stellarcred_issuance_attempts_total[5m]))) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High credential issuance failure rate"
          description: "Credential issuance failure rate is {{ $value | humanizePercentage }} over the last 5 minutes (threshold: > 5%)."

      # 3. API Readiness Failure Alert
      - alert: APIReadyFailing
        expr: stellarcred_api_ready_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "StellarCred API readiness check failing"
          description: "The /api/ready endpoint has returned non-200 or unhealthy status for > 1 minute."

      # 4. Security Violation Alert: Demo Key in Production
      - alert: DemoIssuerKeyActiveInProduction
        expr: stellarcred_demo_issuer_mode{env="production"} == 1
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "SECURITY VIOLATION: Demo issuer key active in production"
          description: "Production environment is currently configured with the hardcoded demo issuer key."

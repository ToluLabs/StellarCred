[package]
name = "credential_verifier"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true, features = ["alloc"] }
ultrahonk_soroban_verifier = { workspace = true }

[dev-dependencies]
# Shared native test harness: deploy-and-wire, register-issuer, set-vk,
# and build-valid-submission helpers, plus the real UltraHonk fixture
# catalog. Host-only; never part of the WASM build.
test_support = { path = "../test_support" }
soroban-sdk = { workspace = true, features = ["testutils", "alloc"] }

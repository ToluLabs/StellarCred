[package]
name = "proof_registry"
version = "1.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Real contract crates, used only to deploy live dependencies in native tests.
# Kept out of [dependencies] to avoid linking their exported wasm symbols.
credential_verifier = { path = "../credential_verifier" }
issuer_registry = { path = "../issuer_registry" }
proptest = "1.4"
# Property-based testing: generates arbitrary u64 values, boundary cases,
# and random mid-range values to verify check_claim threshold logic exhaustively.
